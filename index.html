<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Results Summary</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="container">

        <section class="result-card">

            <div class="result">

                <h2>Your Result</h2>

                <div class="score">
                    <span id="total-score">76</span>
                    <small>of 100</small>
                </div>

                <h1>Great</h1>

                <p>
                    You scored higher than 65% of the people
                    who have taken these tests.
                </p>

            </div>


            <div class="summary">

                <h2>Summary</h2>

                <div class="summary-item reaction">

                    <span>Reaction</span>

                    <strong>
                        <span id="reaction-score">80</span> / 100
                    </strong>

                </div>


                <div class="summary-item memory">

                    <span>Memory</span>

                    <strong>
                        <span id="memory-score">92</span> / 100
                    </strong>

                </div>


                <div class="summary-item verbal">

                    <span>Verbal</span>

                    <strong>
                        <span id="verbal-score">61</span> / 100
                    </strong>

                </div>


                <div class="summary-item visual">

                    <span>Visual</span>

                    <strong>
                        <span id="visual-score">73</span> / 100
                    </strong>

                </div>


                <button class="continue">
                    Continue
                </button>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
